name: Generate AI Semantic Vault with Gemini

on:
  schedule:
    - cron: '0 2 * * 0' # S'exécute automatiquement chaque dimanche à 02h00 du matin
  workflow_dispatch: # Permet de lancer la génération manuellement en 1 clic
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-ai-vault:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du depot
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generation & Enrichissement Continu par Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > generate_ai_vault.js
          const fs = require('fs');
          const https = require('https');
          const zlib = require('zlib');
          const path = require('path');

          const API_KEY = process.env.GEMINI_API_KEY;
          if (!API_KEY) {
            console.error("ERREUR : GEMINI_API_KEY est absente des Secrets GitHub !");
            process.exit(1);
          }

          const BATCHES_PER_TIER = 8; // 8 requêtes x 25 = 200 nouvelles énigmes fraîches par palier à chaque run

          const TIERS = [
            { id: 1, name: 'tier1_facile', diff: 'Niveau Debutant (Niv 1-10) : Objets simples du quotidien, animaux, nature evidente, actions familieres.' },
            { id: 2, name: 'tier2_moyen', diff: 'Niveau Intermediaire (Niv 11-30) : Metiers, sciences, sports, geographie, cuisine, culture, architecture.' },
            { id: 3, name: 'tier3_difficile', diff: 'Niveau Avance (Niv 31-60) : Concepts abstraits, physique, histoire, biologie, processus complexes.' },
            { id: 4, name: 'tier4_expert', diff: 'Niveau Expert / Maitre (Niv 61-100+) : Litterature, mythologie, vocabulaire noble, alchimie, philosophie.' }
          ];

          const THEMES = [
            "Sciences & Espace", "Nature & Animaux", "Histoire & Civilisations",
            "Cuisine & Terroir", "Arts & Musique", "Sports & Aventure",
            "Objets & Outils", "Sensations & Philosophie", "Geographie & Reliefs",
            "Maitrise des Metiers", "Mythologie & Legendes", "Inventions & Decouvertes"
          ];

          function callGemini(prompt) {
            return new Promise((resolve, reject) => {
              const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
              const payload = JSON.stringify({
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: {
                  temperature: 0.85,
                  topP: 0.95
                }
              });

              const req = https.request(url, {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Content-Length': Buffer.byteLength(payload)
                }
              }, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const parsed = JSON.parse(data);
                    if (parsed.error) return reject(new Error("Gemini Error: " + JSON.stringify(parsed.error)));
                    let text = parsed.candidates[0].content.parts[0].text;
                    text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                    resolve(JSON.parse(text));
                  } catch (e) {
                    reject(new Error("Parse error : " + data.substring(0, 200)));
                  }
                });
              });

              req.on('error', reject);
              req.write(payload);
              req.end();
            });
          }

          async function sleep(ms) {
            return new Promise(r => setTimeout(r, ms));
          }

          async function run() {
            fs.mkdirSync('vault_packs', { recursive: true });
            let globalId = Date.now() % 1000000;

            for (const tier of TIERS) {
              console.log(`\n=== Generation IA pour ${tier.name} ===`);
              const destGz = path.join('vault_packs', `${tier.name}.json.gz`);
              const destJson = path.join('vault_packs', `${tier.name}.json`);

              let pool = [];
              const seenCombos = new Set();

              // Charger les énigmes existantes pour cumuler sans jamais perdre
              if (fs.existsSync(destGz)) {
                try {
                  const existingBuf = fs.readFileSync(destGz);
                  const decomp = zlib.gunzipSync(existingBuf).toString('utf-8');
                  pool = JSON.parse(decomp);
                  pool.forEach(item => seenCombos.add(`${item[1]}#${item[2]}#${item[3]}`));
                  console.log(`[Base existante] ${pool.length} enigmes chargees.`);
                } catch (e) {
                  // Nouveau fichier
                }
              }

              for (let b = 0; b < BATCHES_PER_TIER; b++) {
                const theme = THEMES[(b + Math.floor(Math.random() * THEMES.length)) % THEMES.length];
                console.log(`[Palier ${tier.id}] Lot ${b + 1}/${BATCHES_PER_TIER} (${theme})...`);

                const prompt = `Tu es le createur du jeu "2Mots".
Reponds UNIQUEMENT par un tableau JSON brut contenant 25 enigmes semantiques INEDITES, 100% FRANCAISES et HAUTEMENT LOGIQUES.

Difficulte : ${tier.diff}
Theme de ce lot : ${theme}

REGLES ABSOLUES :
1. word1 + word2 doivent mener naturellement et avec certitude a "answer".
2. answer, distractor1 et distractor2 DOIVENT avoir STRICTEMENT la meme nature grammaticale (3 verbes a l infinitif OU 3 noms singuliers OU 3 adjectifs).
3. L indice "clue" doit etre concis, elegant et percutant.

Format JSON attendu :
[
  {
    "word1": "TERRE",
    "word2": "LUNE",
    "answer": "ORBITER",
    "clue": "Mouvement perpetuel autour d un astre",
    "difficulty": ${tier.id === 1 ? 1 : tier.id === 2 ? 4 : tier.id === 3 ? 7 : 9},
    "type": "verbe",
    "distractor1": "TOURNER",
    "distractor2": "GRAVITER"
  }
]`;

                try {
                  const enigmas = await callGemini(prompt);
                  if (Array.isArray(enigmas)) {
                    let added = 0;
                    for (const item of enigmas) {
                      if (!item.word1 || !item.word2 || !item.answer) continue;
                      const w1 = String(item.word1).toUpperCase().trim();
                      const w2 = String(item.word2).toUpperCase().trim();
                      const ans = String(item.answer).toUpperCase().trim();
                      const key = `${w1}#${w2}#${ans}`;
                      if (seenCombos.has(key)) continue;
                      seenCombos.add(key);

                      const d1 = String(item.distractor1 || 'CHOIX A').toUpperCase().trim();
                      const d2 = String(item.distractor2 || 'CHOIX B').toUpperCase().trim();

                      pool.push([
                        globalId++,
                        w1,
                        w2,
                        ans,
                        item.clue || "Point commun semantique",
                        item.difficulty || (tier.id * 2),
                        item.type || "nom",
                        d1,
                        d2
                      ]);
                      added++;
                    }
                    console.log(` -> Reussi (+${added} nouvelles enigmes ajoutees)`);
                  }
                } catch (err) {
                  console.warn(`Avertissement :`, err.message);
                }

                await sleep(3000);
              }

              // Sauvegarde cumulative (JSON brut + GZ)
              const raw = JSON.stringify(pool);
              fs.writeFileSync(destJson, raw, 'utf-8');
              const gz = zlib.gzipSync(Buffer.from(raw));
              fs.writeFileSync(destGz, gz);
              console.log(`[Succes] ${tier.name} mis a jour avec un total de ${pool.length} enigmes.`);
            }
          }

          run().catch((err) => {
            console.error("Erreur critique :", err);
            process.exit(1);
          });
          EOF

          node generate_ai_vault.js

      - name: Publication automatique dans la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest AI Semantic Vault
          draft: false
          prerelease: false
          files: |
            vault_packs/*.json.gz
            vault_packs/*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
